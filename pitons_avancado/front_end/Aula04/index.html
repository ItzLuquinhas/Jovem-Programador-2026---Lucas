<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Aula 04</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form>
            <div class="janela_login">
                <input type="text" placeholder="Usuário" id="username" required>
                <input type="email" placeholder="E-mail" id="email" required>
                <input type="password" placeholder="Password" id="password" required>
                <input type="date" placeholder="Data de Nascimento" id="data_nascimento" required>
                <select id="estados_login" required>
                    <option value="" disabled selected>Estado</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="PR">Paraná</option>
                </select>
                <textarea name="comentarios" id="comentarios" placeholder="Digite seu comentário"></textarea>
                <!-- Hobbies -->
                <div class="grupo_opcoes">
                    <h3>Hobbies</h3>
                    <div class="opcoes">
                        <label>
                            <input type="checkbox" id="hobbie_esporte">
                            Esporte
                        </label>

                        <label>
                            <input type="checkbox" id="hobbie_games">
                            Games
                        </label>

                        <label>
                            <input type="checkbox" id="hobbie_musica">
                            Música
                        </label>
                    </div>

                </div>
                <!-- Período -->
                <div class="grupo_opcoes">
                    <h3>Período</h3>
                    <div class="opcoes">
                        <label>
                            <input type="radio" id="select_manha" name="periodo">
                            Manhã
                        </label>
                        <label>
                            <input type="radio" id="select_tarde" name="periodo">
                            Tarde
                        </label>
                        <label>
                            <input type="radio" id="select_noite" name="periodo">
                            Noite
                        </label>
                    </div>
                </div>
                <!-- Botões -->
                <div class="botoes">
                    <button type="submit">
                        Enviar
                    </button>
                    <button type="reset">
                        Resetar Dados
                    </button>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
